version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Mondays and Thursdays at 10:00 Yerevan (GMT+4, no DST), every ecosystem.
    schedule:
      interval: cron
      cronjob: '0 10 * * 1,4'
      timezone: Asia/Yerevan
    open-pull-requests-limit: 5
    # Patch and minor updates arrive as one PR per group, so routine bumps do
    # not consume five slots and hide a security update behind them.
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    # Majors come one at a time: they need a human reading the changelog.
    ignore:
      # typescript-eslint does not support TypeScript 7, so taking it would
      # silently disable every type-aware rule -- no-floating-promises and
      # no-misused-promises above all, which are the ones that matter in a
      # scheduler. tsc itself already passes clean under 7, so this is purely
      # the lint toolchain. Tracked upstream at
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: deps
      prefix-development: deps-dev

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: cron
      cronjob: '0 10 * * 1,4'
      timezone: Asia/Yerevan
    ignore:
      # The Node version is four coordinated values -- the Dockerfile, the CI
      # setup-node version, .nvmrc and the engines field. Bumping only the
      # image would ship a runtime nothing tests against. Majors are also how
      # a non-LTS line arrives: Node 26 is Current, not LTS. Moving LTS lines
      # is a deliberate change across all four, not a dependency bump.
      - dependency-name: node
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 10 * * 1,4'
      timezone: Asia/Yerevan
    commit-message:
      prefix: ci
