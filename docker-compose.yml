name: probeboard

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: probeboard
      POSTGRES_PASSWORD: probeboard
      POSTGRES_DB: probeboard
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U probeboard -d probeboard']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ['node', 'dist/core/db/migrator/cli.js', 'up']
    environment:
      DATABASE_URL: postgres://probeboard:probeboard@postgres:5432/probeboard
      # The migrator loads the full app config just for DATABASE_URL, so
      # every required key -- this one included -- has to be set here too.
      # Fixed, like the Postgres password above: this stack is a local demo,
      # not a place real secrets belong. `openssl rand -base64 32` for a real
      # deployment.
      HEADER_ENCRYPTION_KEY: 'dqLhOBUQykRUIXmfvJzR5v52vAm8SpLNIPreseVmKfo='
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build: .
    command: ['node', 'dist/api/main.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://probeboard:probeboard@postgres:5432/probeboard
      # Same fixed value as the migrate and worker services: a secret header
      # encrypted by one process must be decryptable by the other two.
      HEADER_ENCRYPTION_KEY: 'dqLhOBUQykRUIXmfvJzR5v52vAm8SpLNIPreseVmKfo='
      API_PORT: '3000'
      COOKIE_SECURE: 'false'
      # Browsable API documentation at http://127.0.0.1:3000/docs
      API_DOCS_ENABLED: 'true'
      # Read from the gitignored .env next to this file (docker compose's own
      # interpolation, separate from the app's --env-file-if-exists loading)
      # so real credentials never need a committed edit here. With no .env,
      # every value falls back to a placeholder: enough to exercise /start
      # (redirect-building, PKCE, the state cookie and its pending row) and
      # every callback refusal path (missing cookie, foreign state, replay,
      # expired) without reaching a provider at all -- the full round trip is
      # proved instead by the integration suite against the local stub
      # (src/api/auth/e2e/oauth-*.int.test.ts). Actually completing a sign-in
      # against this compose stack with placeholders will fail at the
      # provider with invalid_client, which is expected. A real .env with
      # real values makes the redirect actually reach Google or GitHub, per
      # docs/tracker.md F1.
      OAUTH_ENABLED: 'true'
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-placeholder-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-placeholder-client-secret}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-placeholder-client-id}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-placeholder-client-secret}
      OAUTH_REDIRECT_BASE_URL: 'http://127.0.0.1:3000'
      WEB_BASE_URL: 'http://127.0.0.1:5173'
    ports:
      - '3000:3000'
    restart: unless-stopped
    healthcheck:
      # readyz, not healthz: a container that cannot reach the database is not
      # serving, and should be reported as unhealthy rather than merely alive.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: ['node', 'dist/worker/main.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://probeboard:probeboard@postgres:5432/probeboard
      HEADER_ENCRYPTION_KEY: 'dqLhOBUQykRUIXmfvJzR5v52vAm8SpLNIPreseVmKfo='
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Scale with: docker compose up --scale worker=3 (NFR-7)
    # Longer than SCHEDULER_SHUTDOWN_GRACE_MS's default (35s, §3.9): Docker
    # sends SIGKILL once this elapses, and a kill before the scheduler's own
    # grace expires would cut off exactly the in-flight-probe handling that
    # grace exists to allow. Compose's stop_grace_period is the outer bound,
    # not the one the scheduler reasons about.
    stop_grace_period: 40s

volumes:
  pgdata:
