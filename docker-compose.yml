name: probeboard

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: probeboard
      POSTGRES_PASSWORD: probeboard
      POSTGRES_DB: probeboard
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U probeboard -d probeboard']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ['node', 'dist/core/db/migrator/cli.js', 'up']
    environment:
      DATABASE_URL: postgres://probeboard:probeboard@postgres:5432/probeboard
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build: .
    command: ['node', 'dist/api/main.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://probeboard:probeboard@postgres:5432/probeboard
      API_PORT: '3000'
      COOKIE_SECURE: 'false'
      # Browsable API documentation at http://127.0.0.1:3000/docs
      API_DOCS_ENABLED: 'true'
      # Placeholder credentials: a real Google OAuth client is registered at
      # final testing (tracker.md), not here. These are enough to exercise
      # /start (redirect-building, PKCE, the state cookie and its pending row)
      # and every callback refusal path (missing cookie, foreign state,
      # replay, expired) without reaching Google at all -- the full round
      # trip is proved instead by the integration suite against the local
      # stub (src/api/auth/e2e/oauth-*.int.test.ts). Actually completing a
      # sign-in against this compose stack will fail at Google with
      # invalid_client, which is expected.
      OAUTH_ENABLED: 'true'
      GOOGLE_CLIENT_ID: 'placeholder-client-id'
      GOOGLE_CLIENT_SECRET: 'placeholder-client-secret'
      OAUTH_REDIRECT_BASE_URL: 'http://127.0.0.1:3000'
      WEB_BASE_URL: 'http://127.0.0.1:5173'
    ports:
      - '3000:3000'
    restart: unless-stopped
    healthcheck:
      # readyz, not healthz: a container that cannot reach the database is not
      # serving, and should be reported as unhealthy rather than merely alive.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: ['node', 'dist/worker/main.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://probeboard:probeboard@postgres:5432/probeboard
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Scale with: docker compose up --scale worker=3 (NFR-7)

volumes:
  pgdata:
